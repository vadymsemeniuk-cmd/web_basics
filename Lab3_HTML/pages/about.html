<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лаб. №3: про нас</title>
  
  <!-- Фавіконка -->
  <link rel="icon" type="image/png" href="diamond.png">
  
  <!-- Зовнішні стилі -->
  <link rel="stylesheet" href="../styles/styles.css">
  
  <style>
    h1 {
      text-align: center;
      color: red;
    }
    /* Стиль для центрування та обмеження розміру картинки-банера */
    .banner-container {
      text-align: center; /* Центрує картинку горизонтально */
    }
    .banner-container img {
      max-width: 600px;   /* Обмежуємо максимальну ширину, щоб не була величезною */
      width: 100vw;       /* Адаптивність */
      height: auto;       /* Зберігає пропорції, щоб якість не псувалася */
    }
  </style>
</head>
<body>

  <h1>Наш банер</h1>

  <div class="banner-container">
    <img src="apple-1920.jpg" alt="Банер Apple">
  </div>

  <p><a href="../index.html">На головну</a></p>

</body>
</html>
